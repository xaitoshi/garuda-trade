# Local Postgres for development: docker compose up -d db
# Then: DATABASE_URL=postgres://garuda:garuda@localhost:5432/garuda pnpm api
# Real-Postgres tests: GARUDA_TEST_DATABASE_URL=postgres://garuda:garuda@localhost:5432/postgres pnpm test
# (or without docker: GARUDA_TEST_PG=embedded pnpm test)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: garuda
      POSTGRES_PASSWORD: garuda
      POSTGRES_DB: garuda
    ports:
      - "5432:5432"
    volumes:
      - garuda-pg:/var/lib/postgresql/data
volumes:
  garuda-pg:
